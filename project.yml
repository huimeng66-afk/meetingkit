name: MeetingKit

packages:
  # Socket.IO 信令客户端（与 Web 端同一套服务器协议）
  SocketIO:
    url: https://github.com/socketio/socket.io-client-swift
    from: 16.1.1
  # WebRTC 官方框架的 SPM 二进制镜像（GoogleWebRTC 的 community 分发）。
  # 注意：这里必须用 stasel 仓库自己的版本号（141.0.0 这类），
  # 不能写 Google 上游的 124.6367.3 —— 本仓库没有那个 tag，SPM 会直接解析失败。
  # 用 exactVersion 锁定。注意不要用 141.x：M141 的 framework 头文件里写着
  # `#import "sdk/objc/base/RTCMacros.h"`，但发布包里头文件是扁平存放的，
  # 编译必然报 file not found（上游 issue 450130875，M143 才修）。
  # M140 是最后一个头文件路径正常的版本。
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: 140.0.0

options:
  bundleIdPrefix: com.tianqiong
  # Xcode 26 的部署目标下限就是 iOS 15（Apple 支持表：iOS 15~26）。
  # 原来写 14.0 在 Xcode 16 上只是 warning，换到 Xcode 26 会直接报
  # "range of supported deployment target versions is 15.0 to 26.x"。
  # 本项目真机是 iOS 26，抬到 15 不损失任何用户。
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  minimumXcodeGenVersion: "2.35.0"

settings:
  base:
    # 锁 5.0 而不是 5.9：SWIFT_VERSION 只接受语言模式（4.0 / 4.2 / 5.0，Xcode 16 起多一个 6.0），
    # 5.9 是编译器版本、不是合法取值；选 5.0 同时避免默认进入 Swift 6 的严格并发检查，
    # 让同一份工程在 Xcode 14~16 上都能编过（baseline 已降到 iOS 14.0，
    # 所有 15+ 的便利 API 都在 CompatKit / LiquidGlass 里给了 13/14 的等价写法）。
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    # 两个 Info.plist 都是手写的，禁止 Xcode 再自动生成一份覆盖它。
    GENERATE_INFOPLIST_FILE: "NO"
    CODE_SIGN_STYLE: Automatic

targets:
  MeetingKit:
    type: application
    platform: iOS
    sources:
      - path: MeetingKit
        excludes:
          - "Info.plist"
          - "MeetingKit.entitlements"
      - path: Shared
    dependencies:
      # 扩展必须内嵌到 App 的 PlugIns 目录，否则系统「屏幕录制」列表里看不到它。
      - target: MeetingBroadcast
        embed: true
        codeSign: true
      - package: SocketIO
        product: SocketIO
      - package: WebRTC
        product: WebRTC
    settings:
      base:
        PRODUCT_NAME: MeetingKit
        PRODUCT_BUNDLE_IDENTIFIER: com.tianqiong.meetingkit
        INFOPLIST_FILE: MeetingKit/Info.plist
        CODE_SIGN_ENTITLEMENTS: MeetingKit/MeetingKit.entitlements
        # 没有这一行，Assets 里的 AppIcon 不会被真正用上，提审时是"图标缺失"。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.9.25"
        CURRENT_PROJECT_VERSION: "82"
        # ScreenCaptureKit 的链接方式由 scripts/build-ipa-unsigned.sh 按 SDK
        # 版本决定（iOS 27+ 才加 -weak_framework）：Xcode 26 的 iOS SDK 里
        # 没有这个 framework，写死会直接链接失败；而强链接又会让产物在
        # iOS 26 设备上 dyld 找不到框架、App 起不来。

  MeetingBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: BroadcastExtension
        excludes:
          - "Info.plist"
          - "MeetingBroadcast.entitlements"
      # 与主 App 共用同一份 Shared 源码：两个 Target 各自编译一份，
      # 靠 App Group + Darwin 通知在两个进程间对齐状态。
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: MeetingBroadcast
        PRODUCT_BUNDLE_IDENTIFIER: com.tianqiong.meetingkit.Broadcast
        INFOPLIST_FILE: BroadcastExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: BroadcastExtension/MeetingBroadcast.entitlements
        # 扩展进程禁止调用 application-only 的 API，打开这个开关能让编译器提前拦住误用。
        APPLICATION_EXTENSION_API_ONLY: "YES"
        SKIP_INSTALL: "YES"
        MARKETING_VERSION: "1.9.25"
        CURRENT_PROJECT_VERSION: "82"

# XcodeGen 默认不会生成共享 scheme，CI 里的 `xcodebuild -scheme MeetingKit`
# 会因为找不到 scheme 直接失败（本地 Xcode 打开工程时会自动补，所以只在 CI 暴露）。
# 显式声明后，archive 固定用 Release，run 固定 Debug。
schemes:
  MeetingKit:
    build:
      targets:
        MeetingKit: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
