# iOS 构建工作流 —— 产出「未签名 IPA」
#
# ⚠️ 重要：本工作流产出的 .ipa 是**未签名**的。
#    · 它不能被 iPhone 直接安装，也不能上 App Store。
#    · 必须用 Sideloadly（Windows / macOS）或 AltStore 打开，
#      填你自己的 Apple ID，工具会用你的免费证书重新签名后再装到设备。
#    · 免费 Apple ID 签出来的 App **7 天**后过期（设备需保持「开发者模式」开启），
#      过期后重新执行一次同样的安装流程即可，数据不会丢。
#    · 免费个人团队通常**不授予 App Groups 能力**，重签时可能报
#      “Provisioning profile doesn't support App Groups”，
#      此时屏幕共享扩展装不上，但主 App 界面仍可安装用于验证 UI。
#
# 为什么这里不签名：仓库里不可能存放任何人的证书和私钥。
# 签名这一步必须在「有你自己 Apple ID 的机器」上完成。
#
# 详细图文步骤见 docs/build-and-install.md。

name: iOS Build (unsigned IPA)

on:
  # 手动触发：Actions 页面 → 本工作流 → Run workflow
  workflow_dispatch:
    inputs:
      configuration:
        description: '构建配置'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
  # 打 tag 时自动构建，例如：git tag v1.0.0 && git push origin v1.0.0
  push:
    tags:
      - 'v*'

# 同一分支/tag 只保留最新一次构建，避免重复消耗 macOS 分钟数
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build MeetingKit (unsigned)
    # 为什么不再用 macos-26：该标签的 arm64 机器长期排队，
    # 上一次 run（41912347929）在队列里等了 15 分钟后直接以
    # "The job was not acquired by Runner of type hosted" 失败，代码一行没编。
    #
    # macos-15 镜像同样预装了 Xcode 26（26.0.1 / 26.1.1 / 26.2 / 26.3），
    # 只是默认指向 Xcode 16.4，需要显式 xcode-select 切过去。
    # LiquidGlass.swift 的原生玻璃整段包在 `#if compiler(>=6.2)` 里：
    # Swift 6.0/6.1 会把整段跳过，构建仍然成功、产物却没有 glassEffect。
    # 所以下面除了切换，还会硬性校验 Swift 版本——宁可构建失败，
    # 也不要再产出一个"看起来绿了、装上却是塑料片"的包。
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          # 取版本号最大的 Xcode 26（sort -V 会把 26.9 排在 26.10 前面，
          # 这里用 sort -V 已经足够：同一大版本内官方只会存在个位数小版本）。
          CANDIDATE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$CANDIDATE" ]; then
            echo "::error::该 runner 没有安装 Xcode 26，无法编译原生 Liquid Glass"
            exit 1
          fi
          sudo xcode-select -s "$CANDIDATE"
          echo "Selected: $CANDIDATE"

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun swift --version

      - name: Require Swift 6.2+
        run: |
          set -euo pipefail
          SWIFT_VERSION="$(xcrun swift --version | head -1 | sed -E 's/.*version ([0-9]+\.[0-9]+).*/\1/')"
          echo "Swift $SWIFT_VERSION"
          awk -v v="$SWIFT_VERSION" 'BEGIN { exit (v >= 6.2 ? 0 : 1) }' \
            || { echo "::error::需要 Swift 6.2+（当前 $SWIFT_VERSION），否则 glassEffect 会被整段跳过"; exit 1; }

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build unsigned IPA
        env:
          # tag 触发时 inputs 为空，回退到 Release
          CONFIGURATION: ${{ inputs.configuration || 'Release' }}
        run: |
          set -euo pipefail
          bash scripts/build-ipa-unsigned.sh --configuration "$CONFIGURATION"
          echo "--- 产物 ---"
          ls -lh build/*.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: MeetingKit-unsigned-ipa
          path: build/*.ipa
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

      - name: Upload dSYM (if any)
        if: ${{ hashFiles('build/MeetingKit.xcarchive/dSYMs/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: MeetingKit-dSYM
          path: build/MeetingKit.xcarchive/dSYMs/
          retention-days: 14
          if-no-files-found: ignore

      - name: Build summary
        if: ${{ always() }}
        run: |
          {
            echo "### MeetingKit unsigned IPA"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| Runner | \`${{ runner.os }} / ${{ runner.arch }}\` |"
            echo "| 配置 | \`${{ inputs.configuration || 'Release' }}\` |"
            echo "| 触发 | \`${{ github.event_name }}\` |"
            echo ""
            echo "产物**未签名**：用 Sideloadly / AltStore 以你自己的 Apple ID 重签后安装。"
            echo "免费账号 7 天有效；App Groups 能力可能不被免费账号支持（影响屏幕共享扩展）。"
          } >> "$GITHUB_STEP_SUMMARY"
