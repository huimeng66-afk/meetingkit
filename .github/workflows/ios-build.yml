# iOS 构建工作流 —— 产出「未签名 IPA」
#
# ⚠️ 重要：本工作流产出的 .ipa 是**未签名**的。
#    · 它不能被 iPhone 直接安装，也不能上 App Store。
#    · 必须用 Sideloadly（Windows / macOS）或 AltStore 打开，
#      填你自己的 Apple ID，工具会用你的免费证书重新签名后再装到设备。
#    · 免费 Apple ID 签出来的 App **7 天**后过期（设备需保持「开发者模式」开启），
#      过期后重新执行一次同样的安装流程即可，数据不会丢。
#    · 免费个人团队通常**不授予 App Groups 能力**，重签时可能报
#      “Provisioning profile doesn't support App Groups”，
#      此时屏幕共享扩展装不上，但主 App 界面仍可安装用于验证 UI。
#
# 为什么这里不签名：仓库里不可能存放任何人的证书和私钥。
# 签名这一步必须在「有你自己 Apple ID 的机器」上完成。
#
# 详细图文步骤见 docs/build-and-install.md。

name: iOS Build (unsigned IPA)

on:
  # 手动触发：Actions 页面 → 本工作流 → Run workflow
  workflow_dispatch:
    inputs:
      configuration:
        description: '构建配置'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
  # 打 tag 时自动构建，例如：git tag v1.0.0 && git push origin v1.0.0
  push:
    tags:
      - 'v*'

# 同一分支/tag 只保留最新一次构建，避免重复消耗 macOS 分钟数
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build MeetingKit (unsigned)
    # macos-15 runner 预装 Xcode 16（含 iOS 18 SDK），满足 project.yml 的 iOS 14.0 部署目标
    #
    # ⚠️ iOS 26 原生玻璃（LiquidGlass.swift 里 `#if compiler(>=6.2)` 那段）
    #    需要 **Xcode 26 / Swift 6.2** 才会被编译进去。
    #    macos-15 默认的 Xcode 16（Swift 6.0/6.1）编译器版本号不到 6.2，
    #    `#if compiler(>=6.2)` 整段会被预处理器直接跳过 —— 构建不会失败，
    #    产物只是退回自绘玻璃（`.ultraThinMaterial` / 渐变描边），行为与观感都正确，
    #    所以这里刻意保持 macos-15，避免 runner 镜像不存在把 CI 变红。
    #
    #    需要验证 iOS 26 原生玻璃时，二选一（默认不启用）：
    #      a) 换 runner：把下一行改成 `runs-on: macos-26`（镜像上线后再切）；
    #      b) 留在 macos-15，在 "Show Xcode version" 之前插一步指定 Xcode 26：
    #           - name: Select Xcode 26
    #             run: sudo xcode-select -s /Applications/Xcode_26.app
    #         并在该 step 前加 `if: ${{ vars.USE_XCODE_26 == 'true' }}`，
    #         这样默认构建仍然用 runner 自带的 Xcode 16。
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build unsigned IPA
        env:
          # tag 触发时 inputs 为空，回退到 Release
          CONFIGURATION: ${{ inputs.configuration || 'Release' }}
        run: |
          set -euo pipefail
          bash scripts/build-ipa-unsigned.sh --configuration "$CONFIGURATION"
          echo "--- 产物 ---"
          ls -lh build/*.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: MeetingKit-unsigned-ipa
          path: build/*.ipa
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

      - name: Upload dSYM (if any)
        if: ${{ hashFiles('build/MeetingKit.xcarchive/dSYMs/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: MeetingKit-dSYM
          path: build/MeetingKit.xcarchive/dSYMs/
          retention-days: 14
          if-no-files-found: ignore

      - name: Build summary
        if: ${{ always() }}
        run: |
          {
            echo "### MeetingKit unsigned IPA"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| Runner | \`${{ runner.os }} / ${{ runner.arch }}\` |"
            echo "| 配置 | \`${{ inputs.configuration || 'Release' }}\` |"
            echo "| 触发 | \`${{ github.event_name }}\` |"
            echo ""
            echo "产物**未签名**：用 Sideloadly / AltStore 以你自己的 Apple ID 重签后安装。"
            echo "免费账号 7 天有效；App Groups 能力可能不被免费账号支持（影响屏幕共享扩展）。"
          } >> "$GITHUB_STEP_SUMMARY"
